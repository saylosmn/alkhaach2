services:
  - type: web
    name: alkhaach2
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Render-ийн PORT-г заавал уншиж, 0.0.0.0 дээр bind хийнэ
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: MONGO_URL          # MongoDB Atlas connection string
        sync: false
      - key: DB_NAME
        value: alkhaach
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: PUBLIC_BASE_URL    # ж: https://alkhaach2.onrender.com
        sync: false
      # Апп руу буцаах зөвшөөрөгдсөн redirect-үүд (open-redirect хамгаалалт).
      # Scheme + host(:port) яг таарах ёстой. Production дээр зөвхөн alkhaach://.
      # exp:// эсвэл localhost-ыг production дээр НЭМЭХГҮЙ — session хулгайлах боломж олгоно.
      - key: ALLOWED_REDIRECT_PREFIXES
        value: "alkhaach://"
      # Мэдэгдлийг гадны cron-оор жолоодох бол: SCHEDULER_IN_PROCESS=0 болгоод
      # NOTIFY_SECRET тохируулж, POST /api/internal/notify-tick-ыг 5 мин тутам дуудна.
      - key: SCHEDULER_IN_PROCESS
        value: "1"
      - key: NOTIFY_SECRET
        sync: false

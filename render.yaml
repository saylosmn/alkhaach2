services:
  - type: web
    name: alkhaach-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Render-ийн PORT-г заавал уншиж, 0.0.0.0 дээр bind хийнэ
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: MONGO_URL          # MongoDB Atlas connection string
        sync: false
      - key: DB_NAME
        value: alkhaach
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: PUBLIC_BASE_URL    # ж: https://alkhaach-api.onrender.com
        sync: false
